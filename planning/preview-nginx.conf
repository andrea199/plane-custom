events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  server {
    listen 3000;
    root /usr/share/nginx/html;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store;
    location /api/ { proxy_pass http://planning-preview-api:8000; proxy_set_header Host $http_host; }
    location /preview/ { proxy_pass http://planning-preview-api:8000; proxy_set_header Host $http_host; }
    location /oniro-planning/ { try_files $uri =404; }
    location / { try_files /oniro-planning/index.html =404; }
  }
}
